name: Update Prop Labs NFL data
on:
  push:
    branches: [main]
    paths:
      - update_nfl.py
      - update_nfl_markets.py
      - update_markets.py
      - test_nfl.py
      - .github/workflows/update-nfl.yml
  workflow_dispatch:
  schedule:
    - cron: '22,52 * * * *'
permissions:
  contents: write
concurrency:
  group: prop-labs-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test NFL source and market safeguards
        run: python -m unittest test_nfl
      - name: Verify NFL statistics and snap appearances
        run: python update_nfl.py
      - name: Match available Kalshi NFL markets
        run: python update_nfl_markets.py
      - name: Publish verified NFL snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl_props.json data/nfl_game_cache.json data/nfl_markets.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified NFL prop data [skip ci]'
            # Prefer the freshly calculated feed when another updater changed the same JSON.
            git pull --rebase -X theirs origin main
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git pull --rebase -X theirs origin main
              sleep 3
            done
          fi
