name: Update Prop Labs NBA data
on:
  push:
    paths:
      - update_data.py
      - update_markets.py
      - test_markets.py
      - .github/workflows/update-nba.yml
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: prop-labs-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test market matching safeguards
        run: python -m unittest test_markets
      - name: Fetch NBA scores and recalculate props
        run: python update_data.py
      - name: Match available Kalshi player markets
        run: python update_markets.py
      - name: Publish updated JSON when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/props.json data/game_cache.json data/markets.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NBA prop data [skip ci]'
            git pull --rebase origin main
            git push
          fi
