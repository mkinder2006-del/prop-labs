name: Update Prop Labs depth charts
on:
  workflow_dispatch:
  push:
    paths:
      - update_depthcharts.py
      - .github/workflows/update-depthcharts.yml
  schedule:
    - cron: '5 */2 * * *'
permissions:
  contents: write
concurrency:
  group: prop-labs-data-update
  cancel-in-progress: false
jobs:
  depthcharts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh projected depth charts
        run: python update_depthcharts.py
      - name: Publish verified team depth charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/depthcharts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update projected depth charts [skip ci]'
            git pull --rebase -X theirs origin main
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              git pull --rebase -X theirs origin main
              sleep 3
            done
          fi
