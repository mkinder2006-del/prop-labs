name: Deploy verified Prop Labs dashboard
on:
  workflow_run:
    workflows: ['Update Prop Labs NBA data', 'Update Prop Labs NFL data']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, space-flight.js, assets/**, .github/workflows/deploy-pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require verified data and prepare website
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/props.json'))
          assert d.get('status') == 'ok' and d.get('verified') is True and d.get('rows'), 'No verified data to deploy'
          PY
          mkdir -p _site/data
          cp index.html space-flight.js _site/
          cp -R assets _site/
          cp data/props.json _site/data/
          cp data/markets.json _site/data/
          cp data/nfl_props.json data/nfl_markets.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
